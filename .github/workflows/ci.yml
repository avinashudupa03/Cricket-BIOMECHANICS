name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: install deps, run tests, check syntax
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m py_compile config.py app.py main.py process_video.py process_all.py
          python -m py_compile pose_extractor.py landmark_extractor.py angle_calculator.py
          python -m py_compile phase_detector.py biomechanics_analyzer.py finalize_analysis.py
          python -m py_compile shot_rating.py shot_rater.py output_video.py plot_angles.py
          python -m py_compile video_preprocess.py injury_risk.py provenance.py
          python -m py_compile build_dataset.py data_validation.py feature_engineering.py
          python -m py_compile prepare_ml_data.py train_models.py ml_model.py
          python -m py_compile evaluate_models.py feature_importance.py eda.py
          python -m py_compile data_quality.py robustness_report.py smoke_test.py
          python -m py_compile report_generator.py

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run smoke test
        run: python smoke_test.py

  # ---------------------------------------------------------------------------
  # Frontend: install deps, type-check, build
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web-main/web-main
        run: npm install

      - name: Type-check (tsc --noEmit)
        working-directory: web-main/web-main
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web-main/web-main
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: verify the image builds
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cricket-biomechanics .

      - name: Verify image runs
        run: |
          docker run -d --name cba-test -p 5000:5000 cricket-biomechanics
          sleep 5
          docker ps | grep cba-test
          docker stop cba-test
