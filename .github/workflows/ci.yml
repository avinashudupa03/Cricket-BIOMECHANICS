name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Run ruff linter
        run: |
          ruff check . --output-format=github

      - name: Run mypy type checker
        run: |
          mypy --ignore-missing-imports --no-error-summary .

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=50

      - name: Run smoke test
        run: |
          python smoke_test.py --smoketest --quiet

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-main/web-main/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-main/web-main
        run: npm ci

      - name: Build frontend
        working-directory: web-main/web-main
        run: npm run build

      - name: Type check frontend
        working-directory: web-main/web-main
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cricket-biomechanics:latest
          load: true